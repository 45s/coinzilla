<section class="graph-viewer" aria-label="Selected scenario graph">
  <div class="graph-scroll">
    <svg
      class="graph-canvas"
      [attr.viewBox]="'0 0 ' + viewModel().width + ' ' + viewModel().height"
      [attr.width]="viewModel().width"
      [attr.height]="viewModel().height"
      role="img"
      [attr.aria-label]="'Expected flow for ' + graph().title"
    >
      <defs>
        <pattern id="scenario-view-grid" width="32" height="32" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="1" class="grid-dot" />
        </pattern>
        <marker id="scenario-view-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
          <path d="M0,0 L14,7 L0,14 z" class="edge-arrow" />
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="url(#scenario-view-grid)" />

      @for (edge of viewModel().edges; track trackEdge($index, edge)) {
        <g class="graph-edge">
          <path [attr.d]="edgePath(edge)" marker-end="url(#scenario-view-arrow)" />
          @if (edge.label) {
            <text [attr.x]="edge.labelPosition.x" [attr.y]="edge.labelPosition.y">{{ edge.label }}</text>
          }
        </g>
      }

      @for (node of viewModel().nodes; track trackNode($index, node)) {
        <g
          class="graph-node"
          [attr.transform]="'translate(' + node.position.x + ',' + node.position.y + ')'"
          [attr.data-kind]="node.type"
          [attr.data-guide-kind]="node.properties['guideKind'] ?? node.type"
        >
          <title>{{ node.label }} — {{ node.description ?? '' }}</title>
          <rect class="node-card" [attr.width]="node.width" [attr.height]="node.height" rx="16" />
          <text class="node-kind" x="28" y="38">{{ node.properties['guideKind'] ?? node.type }}</text>
          <text class="node-label">
            @for (line of node.labelLines; track $index; let lineIndex = $index) {
              <tspan x="28" [attr.y]="78 + lineIndex * 34">{{ line }}</tspan>
            }
          </text>
          <text class="node-description">
            @for (line of node.descriptionLines; track $index; let lineIndex = $index) {
              <tspan x="28" [attr.y]="88 + node.labelLines.length * 34 + lineIndex * 26">{{ line }}</tspan>
            }
          </text>
        </g>
      }
    </svg>
  </div>

  <div class="graph-legend" aria-label="Graph legend">
    <span><i data-kind="start"></i> Start</span>
    <span><i data-kind="action"></i> Production flow</span>
    <span><i data-kind="decision"></i> Decision point</span>
    <span><i data-kind="wait"></i> Condition</span>
    <span><i data-kind="block"></i> Injected failure</span>
    <span><i data-kind="end"></i> Outcome</span>
  </div>

  @if (graph().limitations.length) {
    <details class="graph-limitations">
      <summary>Flow scope and limitations</summary>
      <ul>
        @for (limitation of graph().limitations; track limitation) {
          <li>{{ limitation }}</li>
        }
      </ul>
    </details>
  }
</section>
