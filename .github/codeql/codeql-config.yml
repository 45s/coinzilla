# This file is intended for GitHub CodeQL default setup via the
# github-codeql-config-file repository property.
# Default queries remain enabled. Only the built-in insufficient-password-hash
# query is replaced by the narrowly refined Coinzilla query pack.
name: Coinzilla CodeQL configuration
queries:
  - uses: ./.github/codeql/queries
query-filters:
  - exclude:
      id: js/insufficient-password-hash
