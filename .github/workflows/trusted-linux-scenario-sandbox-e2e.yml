name: Trusted Linux Scenario Sandbox E2E

on:
  pull_request:
    branches:
      - develop
    paths:
      - "apps/harvester/src/infrastructure/scenario-runner/**"
      - "apps/harvester/package.json"
      - ".github/workflows/trusted-linux-scenario-sandbox-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-linux-sandbox:
    name: Trusted Linux namespace and cgroup acceptance
    # This is a dedicated, ephemeral runner. Do not replace with ubuntu-latest:
    # hosted CI does not prove delegated cgroup-v2 or the actual host boundary.
    runs-on: [self-hosted, linux, scenario-sandbox]
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify trusted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          command -v bwrap
          command -v prlimit
          test -r /sys/fs/cgroup/cgroup.controllers
          test -w /sys/fs/cgroup
          grep -qw memory /sys/fs/cgroup/cgroup.controllers
          grep -qw cpu /sys/fs/cgroup/cgroup.controllers
          grep -qw pids /sys/fs/cgroup/cgroup.controllers
          printf 'kernel: '; uname -r
          printf 'cgroup controllers: '; cat /sys/fs/cgroup/cgroup.controllers
          printf 'delegated subtree controllers: '; cat /sys/fs/cgroup/cgroup.subtree_control

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run trusted Linux sandbox E2E
        env:
          SCENARIO_RUNNER_LINUX_SANDBOX_E2E: "1"
        run: pnpm --filter @coinzilla/harvester test:scenario-sandbox-e2e
