name: Temporary Brokers ESLint autofix

on:
  push:
    branches:
      - refactor/brokers/provider-spot-layout

permissions:
  contents: write

concurrency:
  group: brokers-eslint-autofix
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply ESLint autofixes
        shell: bash
        run: |
          set +e
          pnpm exec eslint packages/brokers --fix
          lint_status=$?
          set -e
          echo "ESLINT_AUTOFIX_STATUS=$lint_status" >> "$GITHUB_STEP_SUMMARY"
          pnpm exec eslint packages/brokers --format compact > packages/brokers/.eslint-ci-report.txt || true
          git add packages/brokers
          if git diff --cached --quiet; then
            echo "No automatic fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(brokers): apply repository ESLint autofixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
