name: MongoDB provider integration

on:
  pull_request:
    paths:
      - "packages/db/**"
      - ".github/workflows/mongodb-integration.yml"
  push:
    branches:
      - develop
    paths:
      - "packages/db/**"
      - ".github/workflows/mongodb-integration.yml"

permissions:
  contents: read

concurrency:
  group: mongodb-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-authenticated:
    name: MongoDB standalone with SCRAM authentication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Start authenticated standalone MongoDB
        shell: bash
        run: |
          docker run --detach --name coinzilla-mongodb --publish 27017:27017 \
            --env MONGO_INITDB_ROOT_USERNAME=coinzilla \
            --env MONGO_INITDB_ROOT_PASSWORD=coinzilla-test-only \
            mongo:8.0
          for _ in $(seq 1 60); do
            if docker exec coinzilla-mongodb mongosh \
              "mongodb://coinzilla:coinzilla-test-only@127.0.0.1:27017/admin?authSource=admin" \
              --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          docker logs coinzilla-mongodb
          exit 1
      - name: Verify CRUD and authentication against real MongoDB
        env:
          MONGODB_URI: mongodb://coinzilla:coinzilla-test-only@127.0.0.1:27017/admin?authSource=admin
        run: pnpm --filter @coinzilla/db exec node --test src/infrastructure/mongodb/mongodb.integration.test.js
      - name: Stop MongoDB
        if: always()
        run: docker rm --force coinzilla-mongodb || true

  replica-set-transactions:
    name: MongoDB replica set transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Start MongoDB replica set
        shell: bash
        run: |
          docker run --detach --name coinzilla-mongodb --publish 27017:27017 \
            mongo:8.0 mongod --replSet rs0 --bind_ip_all
          for _ in $(seq 1 60); do
            if docker exec coinzilla-mongodb mongosh --quiet \
              --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec coinzilla-mongodb mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for _ in $(seq 1 60); do
            if docker exec coinzilla-mongodb mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          docker logs coinzilla-mongodb
          exit 1
      - name: Verify replica-set CRUD and transaction commit/abort
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/admin?replicaSet=rs0
        run: pnpm --filter @coinzilla/db exec node --test src/infrastructure/mongodb/mongodb.integration.test.js
      - name: Stop MongoDB
        if: always()
        run: docker rm --force coinzilla-mongodb || true
