name: CodeQL Inline Suppression SARIF Probe

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/codeql-inline-suppression-probe.yml
      - packages/brokers/src/infrastructure/bitunix/spot/auth/create-rest-signature.js
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  inspect-rest-suppression:
    name: Inspect REST signer suppression metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL with the built-in alert-suppression query
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript
          build-mode: none
          queries: default
          packs: codeql/javascript-queries:AlertSuppression.ql

      - name: Analyze without uploading SARIF
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          output: sarif-results
          upload: never

      - name: Verify REST signer suppression metadata
        shell: bash
        run: |
          set -euo pipefail

          sarif_file="$(find sarif-results -type f -name '*.sarif' -print -quit)"
          if [[ -z "${sarif_file}" ]]; then
            echo "::error::CodeQL did not produce a SARIF file."
            exit 1
          fi

          echo "## REST signer CodeQL suppression probe" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "SARIF file: ${sarif_file}" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"

          jq -r '
            [
              .runs[].results[]?
              | select(.ruleId == "js/insufficient-password-hash")
              | select(any(.locations[]?.physicalLocation.artifactLocation.uri?; endswith("create-rest-signature.js")))
              | {
                  ruleId,
                  uri: .locations[0].physicalLocation.artifactLocation.uri,
                  line: .locations[0].physicalLocation.region.startLine,
                  suppressions: (.suppressions // [])
                }
            ]
            | .[]
            | "- \\(.uri):\\(.line) — suppressions: \\(.suppressions | tojson)"
          ' "${sarif_file}" >> "${GITHUB_STEP_SUMMARY}"

          jq -e '
            [
              .runs[].results[]?
              | select(.ruleId == "js/insufficient-password-hash")
              | select(any(.locations[]?.physicalLocation.artifactLocation.uri?; endswith("create-rest-signature.js")))
            ] as $results
            | ($results | length) > 0
              and all($results[]; any(.suppressions[]?; .kind == "IN_SOURCE"))
          ' "${sarif_file}" >/dev/null

          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "PASS: every REST signer result for js/insufficient-password-hash carries an IN_SOURCE suppression in this explicit CLI analysis." >> "${GITHUB_STEP_SUMMARY}"
