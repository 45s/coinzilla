name: Harvester Process Lock

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/harvester/src/infrastructure/process-lock/**"
      - "apps/harvester/src/index.js"
      - ".github/workflows/harvester-process-lock.yml"
  pull_request:
    paths:
      - "apps/harvester/src/infrastructure/process-lock/**"
      - "apps/harvester/src/index.js"
      - ".github/workflows/harvester-process-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-lock:
    name: Process lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run process lock tests
        run: pnpm --filter @coinzilla/harvester exec node --test src/infrastructure/process-lock/acquire-harvester-process-lock.test.js
