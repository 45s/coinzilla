name: CodeQL Query Regression

on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/codeql/**'
      - '.github/workflows/codeql-query-regression.yml'
      - 'packages/brokers/src/infrastructure/bitunix/spot/**'
  workflow_dispatch:

concurrency:
  group: codeql-query-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  query-regression:
    name: CodeQL password-hash query regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Download the CodeQL 2.27.5 JavaScript bundle
        shell: bash
        run: |
          archive="$RUNNER_TEMP/codeql-bundle-javascript-linux64.tar.zst"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.5/codeql-bundle-javascript-linux64.tar.zst
          echo 'b10957140a7969819022eac23a6a37d0c6a65de12a84704ca71c416b980edb5c  '"$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/codeql"
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP/codeql"
          echo "$RUNNER_TEMP/codeql/codeql" >> "$GITHUB_PATH"

      - name: Verify CodeQL CLI and resolve query dependencies
        run: |
          codeql version
          codeql pack install .github/codeql/queries

      - name: Determine whether full default-query validation is required
        id: config-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          full_config_validation=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            full_config_validation=true
          elif git diff --name-only HEAD^ HEAD | grep -Eq '^\.github/codeql/(codeql-config\.yml|queries/qlpack\.yml)$'; then
            full_config_validation=true
          fi
          echo "full_config_validation=$full_config_validation" >> "$GITHUB_OUTPUT"
          echo "Full default-query validation: $full_config_validation"

      - name: Create repository CodeQL database
        run: |
          codeql database create "$RUNNER_TEMP/coinzilla-db" \
            --language=javascript-typescript \
            --source-root="$GITHUB_WORKSPACE" \
            --codescanning-config="$GITHUB_WORKSPACE/.github/codeql/codeql-config.yml" \
            --no-run-unnecessary-builds \
            --threads=0

      - name: Analyze replacement query for fast PR feedback
        if: steps.config-mode.outputs.full_config_validation != 'true'
        run: |
          codeql database analyze "$RUNNER_TEMP/coinzilla-db" .github/codeql/queries \
            --format=sarif-latest \
            --output="$RUNNER_TEMP/coinzilla.sarif" \
            --threads=0
          python .github/codeql/verify-sarif.py "$RUNNER_TEMP/coinzilla.sarif" --repository-custom

      - name: Validate full default-query selection and replacement
        if: steps.config-mode.outputs.full_config_validation == 'true'
        run: |
          codeql database analyze "$RUNNER_TEMP/coinzilla-db" \
            --format=sarif-latest \
            --output="$RUNNER_TEMP/coinzilla.sarif" \
            --threads=0
          python .github/codeql/verify-sarif.py "$RUNNER_TEMP/coinzilla.sarif" --repository

      - name: Prove genuine password hashing is still detected
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/coinzilla-positive-fixture"
          mkdir -p "$fixture"
          cat > "$fixture/password-hash.js" <<'EOF'
          import { createHash } from "node:crypto";

          export function hashPassword(password) {
            return createHash("sha256").update(password).digest("hex");
          }
          EOF
          codeql database create "$RUNNER_TEMP/coinzilla-positive-db" \
            --language=javascript-typescript \
            --source-root="$fixture" \
            --no-run-unnecessary-builds \
            --threads=0
          codeql database analyze "$RUNNER_TEMP/coinzilla-positive-db" .github/codeql/queries \
            --format=sarif-latest \
            --output="$RUNNER_TEMP/coinzilla-positive.sarif" \
            --threads=0
          python .github/codeql/verify-sarif.py "$RUNNER_TEMP/coinzilla-positive.sarif" --positive-fixture
