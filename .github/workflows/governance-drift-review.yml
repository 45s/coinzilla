name: Repository Governance Drift Review

on:
  schedule:
    - cron: "15 8 1 * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: repository-governance-drift-review
  cancel-in-progress: false

jobs:
  open-monthly-review:
    name: Open monthly governance review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create this month's review issue once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          review_month="$(date -u +%Y-%m)"
          issue_title="Repository governance drift review — ${review_month}"
          existing_issue="$(gh issue list --repo "${GH_REPO}" --state all --search "in:title \"${issue_title}\"" --json number --jq '.[0].number // empty')"

          if [ -n "${existing_issue}" ]; then
            echo "Review issue already exists: #${existing_issue}"
            exit 0
          fi

          issue_body="$(cat <<'EOF'
          ## Monthly repository governance review

          Complete the checklist against the live develop and main configuration. Record evidence, exact commit/ruleset identifiers, findings, owners, and follow-up issues. Do not change settings or required checks without an authorized maintainer decision.

          - [ ] Read both live rulesets and any classic branch-protection settings; verify target branches, strictness, bypass actors, required contexts, and review-thread resolution.
          - [ ] Confirm the solo-maintainer review model remains explicit: do not require self-approval or invent CODEOWNERS owners; only add independent reviewers when real maintainers exist.
          - [ ] Verify every required status context still exists and succeeds on the current target-branch head; inspect skipped/cancelled aggregation behavior.
          - [ ] Review .github/workflows/ for unpinned third-party actions, unsafe pull-request permissions, stale runtimes, and unexpected workflow triggers.
          - [ ] Review dependency-audit results and security/code-scanning setup state; triage new findings without automatically making untriaged alerts merge blockers.
          - [ ] Verify workspace test/coverage matrices still match discovered packages and package-owned scripts.
          - [ ] Review active policy exceptions, helper-purity audit status, and outstanding architecture/documentation governance issues.
          - [ ] Check that docs/ci-workflows.md, ROADMAP.md, and canonical engineering standards match the live configuration.

          ## Evidence and disposition

          - Review date (UTC):
          - develop SHA:
          - main SHA:
          - Ruleset IDs / settings evidence:
          - Workflow/action findings:
          - Security findings and triage:
          - Package matrix result:
          - Follow-up issues / PRs:
          - Deferred items and rationale:

          Close this issue only after the evidence and all actionable follow-ups are recorded. This review does not authorize trading, exchange, or production operations.
          EOF
          )"

          gh issue create --repo "${GH_REPO}" --title "${issue_title}" --body "${issue_body}"
