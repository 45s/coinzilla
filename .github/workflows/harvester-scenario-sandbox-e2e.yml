name: Harvester Scenario Runner Linux Sandbox E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harvester-scenario-sandbox-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox-acceptance:
    name: Verify real Linux sandbox boundary
    runs-on: [self-hosted, linux, scenario-sandbox]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run real sandbox boundary acceptance
        run: pnpm --filter @coinzilla/harvester run test:scenario-sandbox-e2e
        env:
          HARVESTER_SCENARIO_SANDBOX: linux-bubblewrap
          SCENARIO_RUNNER_LINUX_SANDBOX_E2E: "1"
