name: Task Preflight CodeQL Regression

on:
  push:
    branches:
      - task/preflight-codeql-1765
  pull_request:
    branches:
      - develop
    paths:
      - 'scripts/task-preflight.js'
      - 'scripts/task-preflight.test.js'
      - '.github/workflows/task-preflight-codeql-regression.yml'
  workflow_dispatch:

concurrency:
  group: task-preflight-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  task-preflight-codeql:
    name: Task preflight multi-character sanitizer regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact task commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Download the CodeQL 2.27.5 JavaScript bundle
        shell: bash
        run: |
          archive="$RUNNER_TEMP/codeql-bundle-javascript-linux64.tar.zst"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.5/codeql-bundle-javascript-linux64.tar.zst
          echo 'b10957140a7969819022eac23a6a37d0c6a65de12a84704ca71c416b980edb5c  '"$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/codeql"
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP/codeql"
          echo "$RUNNER_TEMP/codeql/codeql" >> "$GITHUB_PATH"

      - name: Verify CodeQL CLI and resolve the repository query pack
        run: |
          codeql version
          git rev-parse HEAD
          codeql pack install .github/codeql/queries

      - name: Create task-preflight CodeQL database
        run: |
          codeql database create "$RUNNER_TEMP/task-preflight-db" \
            --language=javascript-typescript \
            --source-root="$GITHUB_WORKSPACE" \
            --codescanning-config="$GITHUB_WORKSPACE/.github/codeql/codeql-config.yml" \
            --no-run-unnecessary-builds \
            --threads=0

      - name: Analyze default queries and capture the exact sanitizer result
        shell: bash
        run: |
          set -euo pipefail
          sarif="$RUNNER_TEMP/task-preflight.sarif"
          codeql database analyze "$RUNNER_TEMP/task-preflight-db" \
            --format=sarif-latest \
            --output="$sarif" \
            --threads=0
          python - "$sarif" <<'PY'
          import json
          import sys

          target_rule = "js/incomplete-multi-character-sanitization"
          target_path = "scripts/task-preflight.js"

          with open(sys.argv[1], encoding="utf-8") as source:
              document = json.load(source)

          findings = []
          rule_definitions = {}
          for run in document.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              for rule in driver.get("rules", []):
                  rule_definitions[rule.get("id")] = rule
              for result in run.get("results", []):
                  if result.get("ruleId") != target_rule:
                      continue
                  locations = result.get("locations", [])
                  matching_locations = []
                  for location in locations:
                      physical = location.get("physicalLocation", {})
                      uri = physical.get("artifactLocation", {}).get("uri", "")
                      if uri.replace("\\", "/").endswith(target_path):
                          matching_locations.append(location)
                  if matching_locations:
                      findings.append({
                          "ruleId": result.get("ruleId"),
                          "level": result.get("level"),
                          "message": result.get("message"),
                          "locations": matching_locations,
                          "codeFlows": result.get("codeFlows", []),
                          "partialFingerprints": result.get("partialFingerprints", {}),
                          "properties": result.get("properties", {}),
                      })

          if target_rule not in rule_definitions:
              raise SystemExit(f"Target query was not selected: {target_rule}")

          print(f"CodeQL query selected: {target_rule}")
          print(f"Matching results in {target_path}: {len(findings)}")
          print(json.dumps({
              "rule": rule_definitions[target_rule],
              "results": findings,
          }, indent=2, sort_keys=True))

          if findings:
              raise SystemExit("Task-preflight CodeQL regression remains present.")
          print("No task-preflight multi-character sanitizer finding detected.")
          PY
