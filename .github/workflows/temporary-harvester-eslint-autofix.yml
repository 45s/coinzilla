name: Temporary Harvester ESLint autofix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/harvester/src/infrastructure/operational-state/**/*.js"
      - "apps/harvester/src/infrastructure/journal/**/*.js"
      - "apps/harvester/src/use-cases/initialize-operational-state-cli.js"
      - "apps/harvester/src/use-cases/restore-harvester-operational-state.js"
      - "apps/harvester/test/recovery/operational-state-crash-matrix.test.js"

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/harvester/infrastructure-modules-develop-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository ESLint autofixes to scoped JavaScript files
        run: |
          pnpm exec eslint --fix \
            apps/harvester/src/infrastructure/operational-state/create-file-operational-state-store.js \
            apps/harvester/src/infrastructure/operational-state/helpers/validate-operational-state-account-facts.js \
            apps/harvester/src/infrastructure/operational-state/helpers/validate-operational-state-execution-facts.js \
            apps/harvester/src/infrastructure/operational-state/helpers/validate-operational-state-lifecycle-facts.js \
            apps/harvester/src/infrastructure/operational-state/helpers/validate-operational-state-order-facts.js \
            apps/harvester/src/infrastructure/operational-state/helpers/validate-operational-state-recovery-facts.js \
            apps/harvester/src/infrastructure/operational-state/helpers/validate-operational-state-recovery-facts.test.js \
            apps/harvester/src/infrastructure/operational-state/operational-state-record-validation.js \
            apps/harvester/src/use-cases/initialize-operational-state-cli.js \
            apps/harvester/src/use-cases/restore-harvester-operational-state.js \
            apps/harvester/test/recovery/operational-state-crash-matrix.test.js || true
      - name: Commit scoped autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/harvester/src/infrastructure/operational-state \
            apps/harvester/src/infrastructure/journal \
            apps/harvester/src/use-cases/initialize-operational-state-cli.js \
            apps/harvester/src/use-cases/restore-harvester-operational-state.js \
            apps/harvester/test/recovery/operational-state-crash-matrix.test.js
          if git diff --cached --quiet; then
            echo "No ESLint autofixes to commit."
            exit 0
          fi
          git commit -m "style(harvester): apply repository ESLint autofixes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
