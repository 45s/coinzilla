name: JavaScript Syntax

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: javascript-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"

      - name: Install and run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and normalize safe ESLint autofixes for the remaining source baseline
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec eslint apps/harvester/src/index.js --fix || true
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import { readFile, writeFile } from "node:fs/promises";
          import { dirname } from "node:path";

          const require = createRequire(import.meta.url);
          const eslintEntry = require.resolve("eslint");
          const espreeEntry = require.resolve("espree", { paths: [dirname(eslintEntry)] });
          const { parse } = require(espreeEntry);
          const file = "apps/harvester/src/index.js";
          const source = await readFile(file, "utf8");
          const ast = parse(source, { ecmaVersion: "latest", sourceType: "module", loc: true });
          const lines = source.split("\n");
          const edits = new Map();

          function visit(node) {
            if (!node || typeof node !== "object") {
              return;
            }
            if (node.type === "ObjectExpression") {
              const objectLine = node.loc.start.line - 1;
              const objectIndent = lines[objectLine].match(/^\s*/)[0].length;
              for (const property of node.properties) {
                const propertyLine = property.loc.start.line - 1;
                if (propertyLine > objectLine) {
                  edits.set(propertyLine, " ".repeat(objectIndent + 2));
                }
              }
            }
            for (const value of Object.values(node)) {
              if (Array.isArray(value)) {
                for (const child of value) {
                  visit(child);
                }
              } else if (value && typeof value === "object" && typeof value.type === "string") {
                visit(value);
              }
            }
          }

          visit(ast);
          for (const [line, indent] of edits) {
            lines[line] = lines[line].replace(/^\s*/, indent);
          }
          await writeFile(file, lines.join("\n"));
          NODE
          git diff --no-ext-diff --no-color -- apps/harvester/src/index.js

      - name: Enforce zero-warning full-workspace ESLint
        run: pnpm lint

      - name: Check JavaScript syntax
        run: node scripts/check-syntax.js

      - name: Test ESLint tooling
        run: node --test scripts/check-eslint-changed.test.js scripts/report-eslint-baseline.test.js

      - name: Report full-workspace ESLint inventory
        run: pnpm lint:report

      - name: Enforce zero ESLint findings in Harvester entrypoint tests
        run: pnpm exec eslint apps/harvester/src/index.test.js --max-warnings 0

      - name: Lint changed JavaScript files against the base-branch baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          pnpm lint:changed

      - name: Check agent policy and domain ownership
        run: node --test scripts/check-agent-policy.test.js && node scripts/check-agent-policy.js

      - name: Test external-link checker
        run: node --test scripts/check-external-links.test.js

      - name: Report Markdown style baseline (report-only)
        run: node --test scripts/markdown-style-baseline.test.js && node scripts/markdown-style-baseline.js

      - name: Enforce Markdown style on changed maintained documents
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node --test scripts/check-markdown-style.test.js
          node scripts/check-markdown-style.js "$BASE_SHA"
