name: JavaScript Syntax

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: javascript-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@a5524e1c19e62881d79c1f1b9b6f09f16356e281 # v1.65.2
        with:
          reporter: local
          fail_level: error
          fail_on_error: true

  syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x

      - name: Check JavaScript syntax
        run: node scripts/check-syntax.js

      - name: Check agent policy and domain ownership
        run: node --test scripts/check-agent-policy.test.js && node scripts/check-agent-policy.js

      - name: Test external-link checker
        run: node --test scripts/check-external-links.test.js

      - name: Report Markdown style baseline (report-only)
        run: node --test scripts/markdown-style-baseline.test.js && node scripts/markdown-style-baseline.js

      - name: Enforce Markdown style on changed maintained documents
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node --test scripts/check-markdown-style.test.js
          node scripts/check-markdown-style.js "$BASE_SHA"
