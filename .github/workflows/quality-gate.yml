name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.24.x"

      - name: Install and run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  workspace-quality:
    name: Workspace JavaScript quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce zero-warning full-workspace ESLint
        run: pnpm lint

      - name: Check JavaScript syntax
        run: node scripts/check-syntax.js

      - name: Test strict ESLint policy
        run: node --test scripts/eslint-policy.test.js scripts/lint-changed.test.js

      - name: Check agent policy and domain ownership
        run: node --test scripts/check-agent-policy.test.js && node scripts/check-agent-policy.js

      - name: Test AST module dependency analysis
        run: pnpm run test:module-dependency-analysis
      - name: Report repository source dependency graph baseline (report-only)
        run: pnpm run report:module-graph
      - name: Enforce workspace package dependency and public-import policy
        run: pnpm run check:workspace-dependency-policy

      - name: Enforce helper purity and unit-test policy
        run: pnpm run check:helper-policy

      - name: Fetch exact PR base for helper naming diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "${BASE_SHA}"

      - name: Enforce context-aware naming for changed helper files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:helper-names:changed -- "${BASE_SHA}"

      - name: Test large production module inventory report
        run: node --test scripts/report-large-production-modules.test.js

      - name: Report large production modules (report-only)
        run: pnpm run report:large-modules

      - name: Report full-tree helper naming baseline (report-only; not a gate)
        continue-on-error: true
        run: pnpm run check:helper-names

      - name: Enforce repository-wide production module filenames
        run: pnpm run check:module-names

      - name: Verify workspace test and coverage matrices
        run: pnpm run check:test-matrix

      - name: Test safe worktree synchronization
        run: pnpm run test:sync-main

      - name: Test external-link checker
        run: node --test scripts/check-external-links.test.js

      - name: Report Markdown style baseline (report-only)
        run: node --test scripts/markdown-style-baseline.test.js && node scripts/markdown-style-baseline.js

      - name: Report full-tree maintained Markdown style baseline
        continue-on-error: true
        run: |
          node --test scripts/markdown-path-policy.test.js scripts/check-markdown-style.test.js
          node scripts/check-markdown-style.js --all-maintained

      - name: Enforce maintained local heading anchors
        run: |
          node --test scripts/check-maintained-markdown-anchors.test.js
          node scripts/check-maintained-markdown-anchors.js

      - name: Enforce Markdown style on changed maintained documents
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PR base SHA is missing or invalid; resolving the current base branch commit."
            git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          node scripts/check-markdown-style.js "${BASE_SHA}"


  strict-changed:
    name: Check strict ESLint for changed files
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request head with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch target branch and verify merge base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git merge-base "origin/${BASE_REF}" "${HEAD_SHA}"

      - name: Enforce strict changed-file ESLint
        env:
          LINT_CHANGED_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          LINT_CHANGED_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: pnpm lint:changed


  required-javascript-quality:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    needs:
      - workspace-quality
      - strict-changed
    if: always()
    steps:
      - name: Require workspace and applicable changed-file checks
        env:
          WORKSPACE_RESULT: ${{ needs.workspace-quality.result }}
          STRICT_RESULT: ${{ needs.strict-changed.result }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${WORKSPACE_RESULT}" != "success" ]; then
            echo "Workspace JavaScript quality failed: ${WORKSPACE_RESULT}"
            exit 1
          fi
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${BASE_REF}" = "develop" ] && [ "${STRICT_RESULT}" != "success" ]; then
            echo "Strict changed-file ESLint failed or did not run: ${STRICT_RESULT}"
            exit 1
          fi
          echo "Workspace JavaScript quality and all applicable strict checks passed."
