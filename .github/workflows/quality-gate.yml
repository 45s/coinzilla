name: JavaScript Syntax

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: javascript-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  temporary-lint-autofix:
    name: Temporary lint autofix
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply safe ESLint autofixes
        run: |
          pnpm exec eslint --fix \
            apps/harvester/src/application/operator/authorize-operator-actor.js \
            apps/harvester/src/application/operator/create-harvester-operator.js \
            apps/harvester/src/application/operator/create-harvester-operator.test.js \
            apps/harvester/src/application/ports/durable-facts.port.js \
            apps/harvester/src/infrastructure/telegram/telegram-operator-adapter.js \
            apps/harvester/src/infrastructure/telegram/telegram-operator-adapter.test.js \
            apps/harvester/src/use-cases/conservative-trading-engine.js \
            apps/harvester/src/use-cases/conservative-trading-engine.multi-market.test.js \
            apps/harvester/src/use-cases/operator-control/pause-market.js \
            apps/harvester/src/use-cases/operator-control/resume-market.js
      - name: Commit and push safe fixes
        run: |
          if git diff --quiet; then
            echo "No automatic fixes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/harvester/src/application/operator apps/harvester/src/application/ports/durable-facts.port.js apps/harvester/src/infrastructure/telegram apps/harvester/src/use-cases/conservative-trading-engine.js apps/harvester/src/use-cases/conservative-trading-engine.multi-market.test.js apps/harvester/src/use-cases/operator-control
          git commit -m "style: apply safe lint fixes to operator-control changes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.x"

      - name: Install and run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        run: node scripts/check-syntax.js

      - name: Test ESLint tooling
        run: node --test scripts/check-eslint-changed.test.js scripts/report-eslint-baseline.test.js

      - name: Report full-workspace ESLint inventory
        run: pnpm lint:report

      - name: Lint changed JavaScript files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          pnpm lint:changed

      - name: Check agent policy and domain ownership
        run: node --test scripts/check-agent-policy.test.js && node scripts/check-agent-policy.js

      - name: Test external-link checker
        run: node --test scripts/check-external-links.test.js

      - name: Report Markdown style baseline (report-only)
        run: node --test scripts/markdown-style-baseline.test.js && node scripts/markdown-style-baseline.js

      - name: Enforce Markdown style on changed maintained documents
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node --test scripts/check-markdown-style.test.js
          node scripts/check-markdown-style.js "$BASE_SHA"
