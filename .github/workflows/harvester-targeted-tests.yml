name: Harvester Targeted Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    name: Run configured Harvester regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run configured targeted tests
        run: pnpm --filter @coinzilla/harvester test:targeted

      - name: Detect Conservative scenario scope
        id: conservative_scenarios
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          if git diff --name-only "$PR_BASE_SHA" "$GITHUB_SHA" | grep -Eq '^(apps/harvester/test/scenarios/|apps/harvester/scripts/run-conservative-scenarios(\.test)?\.js$|apps/harvester/package\.json$|apps/harvester/docs/critical-behaviors\.json$|apps/harvester/docs/domain/(CONSERVATIVE_DOMAIN_SPECIFICATION|CONSERVATIVE_DOMAIN_SCENARIO_TESTS|DOMAIN_TEST_INVENTORY|README)\.md$|apps/harvester/ROADMAP\.md$|docs/testing/SCENARIO_CATALOG\.md$|\.github/workflows/harvester-(conservative-scenarios|targeted-tests)\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Conservative scenarios and generate JSON reports
        if: steps.conservative_scenarios.outputs.run == 'true'
        run: pnpm --filter @coinzilla/harvester scenarios:conservative

      - name: Upload Conservative scenario reports
        if: always() && steps.conservative_scenarios.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conservative-scenario-reports
          path: apps/harvester/reports/conservative-scenarios/*.json
          if-no-files-found: warn
          retention-days: 14

  windows-local-scenario:
    name: Verify local Scenario Runner on Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows Scenario Runner integration tests
        run: pnpm --filter @coinzilla/harvester exec node --test src/infrastructure/http/start-trading-history-api.test.js
