name: Format Conservative scenario sources

on:
  pull_request:
    branches:
      - develop
    paths:
      - "apps/harvester/test/scenarios/**"
      - "apps/harvester/scripts/run-conservative-scenarios.js"

permissions:
  contents: write

concurrency:
  group: format-conservative-scenarios-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  eslint-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.11.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply ESLint autofixes to scenario sources
        run: pnpm --filter @coinzilla/harvester exec eslint --fix "test/scenarios/**/*.js" "scripts/run-conservative-scenarios.js" || true

      - name: Commit ESLint autofixes
        run: |
          if git diff --quiet; then
            echo "No automatic ESLint fixes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/harvester/test/scenarios apps/harvester/scripts/run-conservative-scenarios.js
          git commit -m "style(harvester): apply scenario ESLint fixes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
