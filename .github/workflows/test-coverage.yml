name: Test Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Package test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package tests with coverage
        shell: bash
        run: |
          set +e
          pnpm run test:coverage 2>&1 | tee coverage-output.txt
          test_status=${PIPESTATUS[0]}

          {
            echo '## Test coverage'
            echo
            cat coverage-output.txt
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"
