name: Test Coverage

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: "Coverage (${{ matrix.package }})"
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - package: "@coinzilla/harvester"
            has_coverage_script: false
          - package: "@coinzilla/brokers"
            has_coverage_script: true
          - package: "@coinzilla/db"
            has_coverage_script: true
          - package: "@coinzilla/entities"
            has_coverage_script: false
          - package: "@coinzilla/event-bus"
            has_coverage_script: true
          - package: "@coinzilla/journal"
            has_coverage_script: true
          - package: "@coinzilla/market-simulator"
            has_coverage_script: true
          - package: "@coinzilla/notifiers"
            has_coverage_script: true
          - package: "@coinzilla/utils"
            has_coverage_script: true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.package }} coverage
        run: pnpm --filter "${{ matrix.package }}" exec node --test --experimental-test-coverage

      - name: Enforce ${{ matrix.package }} coverage thresholds
        if: matrix.has_coverage_script
        run: pnpm --filter "${{ matrix.package }}" run test:coverage

  workspace-coverage-gate:
    name: Workspace test coverage
    if: always()
    needs:
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Require every package coverage job to pass
        env:
          MATRIX_RESULT: ${{ needs.coverage.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "::error::At least one package coverage matrix job did not succeed (result: $MATRIX_RESULT)."
            exit 1
          fi
          echo "All package coverage matrix jobs passed."
