name: Test Coverage

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Workspace test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce Brokers package coverage command
        run: pnpm --filter @coinzilla/brokers test:coverage

      - name: Enforce Notifiers package coverage thresholds
        run: pnpm --filter @coinzilla/notifiers test:coverage

      - name: Enforce Event Bus package coverage thresholds
        run: pnpm --filter @coinzilla/event-bus test:coverage

      - name: Enforce Utilities package coverage thresholds
        run: pnpm --filter @coinzilla/utils test:coverage

      - name: Enforce Free-Roll bot coverage thresholds
        run: pnpm --filter @coinzilla/bot-free-roll test:coverage
