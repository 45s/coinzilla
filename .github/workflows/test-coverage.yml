name: Test Coverage

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Workspace test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace tests with coverage
        shell: bash
        run: |
          set +e
          pnpm run test:coverage 2>&1 | tee coverage-output.txt
          test_status=${PIPESTATUS[0]}

          {
            echo '## Workspace test coverage'
            echo
            cat coverage-output.txt
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"

      - name: Enforce Notifiers package coverage thresholds
        run: pnpm --filter @coinzilla/notifiers test:coverage

      - name: Enforce Event Bus package coverage thresholds
        run: pnpm --filter @coinzilla/event-bus test:coverage

      - name: Verify Event Bus coverage thresholds reject insufficient coverage
        shell: bash
        run: |
          verify_threshold() {
            local threshold_flag="$1"
            set +e
            local output
            output="$(pnpm --filter @coinzilla/event-bus exec node --test --experimental-test-coverage "$threshold_flag" --test-coverage-include=src/event-bus.js --test-coverage-include=src/index.js --test-coverage-include=src/helpers/*.js --test-coverage-exclude=src/**/*.test.js 2>&1)"
            local test_status=$?
            set -e

            if [[ "$test_status" -eq 0 ]] || ! grep -Fq "does not meet threshold of 100%" <<< "$output"; then
              printf '%s\\n' "$output"
              echo "::error::Expected Event Bus coverage to fail with $threshold_flag."
              exit 1
            fi
          }

          verify_threshold "--test-coverage-lines=100"
          verify_threshold "--test-coverage-branches=100"

      - name: Enforce Utilities package coverage thresholds
        run: pnpm --filter @coinzilla/utils test:coverage

      - name: Verify Utilities coverage thresholds reject insufficient coverage
        shell: bash
        run: |
          verify_utils_threshold() {
            local threshold_flag="$1"
            set +e
            local output
            output="$(pnpm --filter @coinzilla/utils exec node --test --experimental-test-coverage "$threshold_flag" --test-coverage-include=src/*.js --test-coverage-exclude=src/*.test.js 2>&1)"
            local test_status=$?
            set -e

            if [[ "$test_status" -eq 0 ]] || ! grep -Fq "does not meet threshold of 100%" <<< "$output"; then
              printf '%s\\n' "$output"
              echo "::error::Expected Utilities coverage to fail with $threshold_flag."
              exit 1
            fi
          }

          verify_utils_threshold "--test-coverage-lines=100"
          verify_utils_threshold "--test-coverage-branches=100"

      - name: Enforce Free-Roll bot coverage thresholds
        run: pnpm --filter @coinzilla/bot-free-roll test:coverage
