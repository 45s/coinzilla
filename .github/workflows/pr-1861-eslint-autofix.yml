name: Temporary PR 1861 ESLint autofix

on:
  push:
    branches:
      - feat/harvester/issue-1860-startup-readiness-diagnostics

permissions:
  contents: write

jobs:
  eslint-autofix:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[eslint-autofix]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the synchronized PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply configured ESLint autofixes to PR-changed JavaScript
        run: |
          git fetch --no-tags origin develop
          mapfile -t files < <(git diff --name-only origin/develop...HEAD -- '*.js')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed JavaScript files."
            exit 0
          fi
          pnpm exec eslint --fix "${files[@]}" || true

      - name: Commit and push only ESLint autofixes
        run: |
          if git diff --quiet; then
            echo "ESLint made no automatic fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.js'
          git commit -m "style(harvester): apply safe ESLint autofixes [eslint-autofix]"
          git push origin HEAD:feat/harvester/issue-1860-startup-readiness-diagnostics
