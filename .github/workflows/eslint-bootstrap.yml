name: ESLint bootstrap

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'feature/quality/eslint-adoption' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Generate the dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the initial legacy ESLint baseline
        run: pnpm exec eslint . --suppress-all --suppressions-location eslint-suppressions.json

      - name: Commit generated lockfile and baseline
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml eslint-suppressions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate ESLint dependency lock and legacy baseline"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
